name: NewsScope CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Verify TypeScript & Lint
        run: npm run lint

      - name: Execute Automated Test Suite
        run: npm test

      - name: Build Production Applet
        run: npm run build
